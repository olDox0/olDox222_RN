# ============================================================
# ORN Native Build Configuration (Metalcraft)
# Hardware Alvo: Intel Core i5-1235U (10 Cores, AVX2, FMA)
# ============================================================

[project]
name = "orn_native"
version = "1.0.0"
type = "library"

[compiler]
engine = "gcc"
std = "c11"
opt = "O3"
shield = true
incremental = true

[paths]
sources = [
    "native/*.c",
    "engine/native/*.c"
]
headers = [
    "native/",
    "engine/native/"
]
output = "native/"

# ============================================================
# TARGETS DE COMPILAÇÃO
# ============================================================

# 1. ORN Backend Principal
[[targets]]
name = "orn_backend"
sources = [
    "native/orn_llama_wrapper.c",
    "native/orn_optimizer.c",
    "native/orn_varint.c"
]
output = "native/orn.dll"
# CRÍTICO: -march=native habilita automaticamente AVX2, FMA, SSE4.2, POPCNT
# -fopenmp permite paralelização nos 10 núcleos do 1235U
flags = ["-shared", "-march=native", "-fopenmp", "-DGGML_USE_CPU"]
opt = "O3"
soteria = false

# 2. HTML Stripper Nativo
[[targets]]
name = "orn_html_stripper"
sources = ["engine/native/orn_html.c"]
output = "engine/native/orn_html.dll"
flags = ["-shared", "-march=native", "-O3"]
opt = "O3"
soteria = false
